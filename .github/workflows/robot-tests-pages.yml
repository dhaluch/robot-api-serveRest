name: Robot Framework tests and publish logs to GitHub Pages

on:
  push:
    # Ajuste de acordo com sua branch principal; 'main' é padrão.
    branches: [ main, feature/allure-report ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Robot Framework tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Instala Robot Framework e adaptador Allure para Robot
          pip install robotframework robotframework-requests allure-robotframework allure-python-commons

      - name: Run Robot Framework tests (generate Allure results)
        # Executa os testes e gera resultados padrão e Allure results
        run: |
          mkdir -p results
          # usa o listener do allure-robotframework para gerar allure-results
          robot --outputdir results --listener allure_robotframework tests || true

      - name: Upload test results artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results


  publish_pages:
    name: Publish Allure report to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download test results artifact
        uses: actions/download-artifact@v4
        with:
          name: robot-results
          path: ./

      - name: Upload allure-results (raw) artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: results/allure-results
          if-no-files-found: warn

      - name: Set up JDK (Zulu 17)
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Prepare Allure history (if any)
        if: always()
        run: |
          # If previous gh-pages contains an allure-history folder, copy it to results so Allure can reuse it
          if [ -d gh-pages/allure-history ]; then
            mkdir -p results/allure-history
            cp -r gh-pages/allure-history/* results/allure-history/ || true
          fi

      - name: Prepare allure-results folder
        run: |
          if [ -d results/allure-results ]; then
            mkdir -p results/allure-results || true
          fi

      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.22.0
          echo "Downloading Allure ${ALLURE_VERSION}..."
          wget -qO allure.zip https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.zip
          unzip -q allure.zip -d /tmp
          /tmp/allure-${ALLURE_VERSION}/bin/allure --version

      - name: Generate Allure report into gh-pages/
        if: ${{ hashFiles('results/allure-results/**') != '' }}
        run: |
          # copy previous history to results if present
          if [ -d gh-pages/allure-history ]; then
            mkdir -p results/allure-history
            cp -r gh-pages/allure-history/* results/allure-history/ || true
          fi
          # generate report (output goes to gh-pages)
          /tmp/allure-2.22.0/bin/allure generate results/allure-results -o gh-pages --clean || true
          echo 'Generated Allure report into gh-pages/'

      - name: List gh-pages contents
        if: always()
        run: |
          if [ -d gh-pages ]; then
            echo 'gh-pages content:'
            ls -la gh-pages | sed -n '1,200p'
          else
            echo 'gh-pages directory missing'
          fi

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v1
        with:
          path: gh-pages

      - name: Deploy Pages
        if: always()
        uses: actions/deploy-pages@v1
