name: Robot Framework tests and publish logs to GitHub Pages

on:
  push:
    # Ajuste de acordo com sua branch principal; 'main' é padrão.
    branches: [ main, feature/allure-report ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Robot Framework tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Instala Robot Framework e adaptador Allure para Robot
          pip install robotframework robotframework-requests allure-robotframework allure-python-commons

      - name: Run Robot Framework tests (generate Allure results)
        # Executa os testes e gera resultados padrão e Allure results
        run: |
          mkdir -p results
          # usa o listener do allure-robotframework para gerar allure-results
          robot --outputdir results --listener allure_robotframework tests || true

      - name: Upload test results artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results


  publish_pages:
    name: Publish Allure report to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download test results artifact
        uses: actions/download-artifact@v4
        with:
          name: robot-results
          path: ./

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: '17'

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Prepare Allure history (if any)
        if: always()
        run: |
          # If previous gh-pages contains an allure-history folder, copy it to results so Allure can reuse it
          if [ -d gh-pages/allure-history ]; then
            mkdir -p results/allure-history
            cp -r gh-pages/allure-history/* results/allure-history/ || true
          fi

      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.22.0
          echo "Downloading Allure ${ALLURE_VERSION}..."
          wget -qO allure.zip https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.zip
          unzip -q allure.zip -d /tmp
          /tmp/allure-${ALLURE_VERSION}/bin/allure --version

      - name: Generate Allure report locally
        if: always()
        run: |
          # Ensure results/allure-results exists
          if [ -d results/allure-results ]; then
            /tmp/allure-2.22.0/bin/allure generate results/allure-results -o gh-pages --clean || true
            echo 'Allure report generated into gh-pages/'
          else
            echo 'No allure-results found in results/, skipping Allure generation.'
          fi

      - name: Publish gh-pages by pushing branch (fallback)
        if: always()
        env:
          GH_PAGES_PAT: ${{ secrets.GH_PAGES_PAT }}
        run: |
          set -e
          # If GH_PAGES_PAT is not set, fail with instructive message
          if [ -z "$GH_PAGES_PAT" ]; then
            echo 'Secret GH_PAGES_PAT is not set. Create a Personal Access Token with repo scope and add it as repository secret GH_PAGES_PAT.'
            exit 1
          fi
          # Ensure gh-pages dir exists and has content
          if [ ! -d gh-pages ] || [ -z "$(ls -A gh-pages)" ]; then
            echo 'gh-pages directory missing or empty; nothing to publish.'
            exit 0
          fi
          git --version
          cd gh-pages
          git init
          git checkout -b gh-pages
          git add --all
          git -c user.name='github-actions[bot]' -c user.email='actions@github.com' commit -m "Publish Allure report from workflow" || true
          echo 'Pushing to origin gh-pages...'
          git push --force "https://${GH_PAGES_PAT}@github.com/${{ github.repository }}" gh-pages:gh-pages
