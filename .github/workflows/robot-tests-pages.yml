name: Robot Framework tests and publish logs to GitHub Pages

on:
  push:
    # Ajuste de acordo com sua branch principal; 'main' é padrão.
    branches: [ main, feature/allure-report  ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Robot Framework tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install robotframework robotframework-requests

      - name: Run Robot Framework tests
        # Executa todos os testes da pasta 'tests' e coloca resultados em 'results'
        run: |
          mkdir -p results
          # Se quiser falhar o job em caso de falha de teste, remova '|| true'
          robot --outputdir results tests || true

      - name: Upload test results artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results

  deploy_pages:
    name: Deploy report to GitHub Pages (official)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: robot-results
          path: ./artifact

      - name: Prepare site folder
        run: |
          echo 'Preparing site folder for Pages...'
          mkdir -p site
          # Copy Robot results if present
          if [ -d artifact/results ]; then
            cp -r artifact/results/* site/ || true
          fi
          # Copy Allure report if present
          if [ -d artifact/allure-report ]; then
            cp -r artifact/allure-report/* site/ || true
          fi
          # Fallback: copy any top-level files
          cp -r artifact/* site/ || true
          # Ensure there is an index.html linking to report/log
          echo "<html><body>" > site/index.html
          echo "  <h1>Robot Framework Report</h1>" >> site/index.html
          echo "  <ul>" >> site/index.html
          echo "    <li><a href=\"report.html\">Report</a></li>" >> site/index.html
          echo "    <li><a href=\"log.html\">Log</a></li>" >> site/index.html
          echo "  </ul>" >> site/index.html
          echo "</body></html>" >> site/index.html
          ls -la site || true

      - name: Upload pages artifact (triggers Pages deploy)
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
