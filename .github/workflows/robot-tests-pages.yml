name: Robot Framework tests and publish logs to GitHub Pages

on:
  push:
    # Ajuste de acordo com sua branch principal; 'main' é padrão.
    branches: [ main, feature/allure-report ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Robot Framework tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Instala Robot Framework e adaptador Allure para Robot
          pip install robotframework robotframework-requests allure-robotframework allure-python-commons

      - name: Run Robot Framework tests (generate Allure results)
        # Executa os testes e gera resultados padrão e Allure results
        run: |
          mkdir -p results
          # usa o listener do allure-robotframework para gerar allure-results
          robot --outputdir results --listener allure_robotframework tests || true

      - name: Install Allure CLI
        run: |
          # Versão do Allure CLI (ajuste se necessário)
          ALLURE_VERSION=2.22.0
          echo "Downloading Allure ${ALLURE_VERSION}..."
          wget -qO allure.zip https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.zip
          unzip -q allure.zip -d /tmp
          ls -la /tmp
          export PATH="/tmp/allure-${ALLURE_VERSION}/bin:$PATH"
          /tmp/allure-${ALLURE_VERSION}/bin/allure --version

      - name: Generate Allure report
        run: |
          # Se o listener criou uma pasta allure-results dentro de 'results', gere o relatório
          if [ -d results/allure-results ]; then
            /tmp/allure-2.22.0/bin/allure generate results/allure-results -o allure-report --clean || true
          else
            echo 'No allure-results found in results/; skipping Allure generation.'
          fi

      - name: Upload test results artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: |
            results
            allure-report || true


  publish_pages:
    name: Publish Allure report to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (for context)
        uses: actions/checkout@v4

      - name: Prepare site folder
        run: |
          rm -rf site || true
          mkdir -p site
          # Copy Allure report if exists
          if [ -d allure-report ]; then
            cp -r allure-report/* site/ || true
          fi
          # Also copy Robot classic reports if present
          cp -n results/report.html site/ || true
          cp -n results/log.html site/ || true
          cp -n results/output.xml site/ || true

      - name: List site folder (for debug)
        run: |
          echo '--- site contents ---'
          ls -la site || true

      - name: Pre-check GH_PAGES_PAT secret
        run: |
          if [ -z "${{ secrets.GH_PAGES_PAT }}" ]; then
            echo 'GH_PAGES_PAT secret is NOT set. The deploy step will likely fail.'
            echo 'Please add a Personal Access Token (repo scope) as repository secret GH_PAGES_PAT.'
            exit 1
          else
            echo 'GH_PAGES_PAT is set.'
          fi

      - name: Debug: show git branches (before deploy)
        run: |
          git --version || true
          git ls-remote --heads origin || true

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Use GH_PAGES_PAT secret (create in repo Settings → Secrets → Actions)
          # The action expects either a deploy_key, personal_token or github_token input.
          # Provide the PAT via the 'personal_token' input so the action can push.
          personal_token: ${{ secrets.GH_PAGES_PAT }}
          publish_dir: ./site

      - name: Debug: list remote gh-pages branch
        run: |
          echo '--- remote branches after deploy ---'
          git ls-remote --heads origin gh-pages || true

      - name: Check GitHub Pages status (API)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo 'Querying Pages API for repository...'
          resp=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/pages)
          echo "$resp" | jq '.' || echo "$resp"
          echo 'If there is a "html_url" field above, that is the Pages URL.'
