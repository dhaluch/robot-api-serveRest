name: Robot Framework tests and publish logs to GitHub Pages

on:
  push:
    # Ajuste de acordo com sua branch principal; 'main' é padrão.
    branches: [ main, feature/inicio ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Robot Framework tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install robotframework robotframework-requests

      - name: Run Robot Framework tests
        # Executa todos os testes da pasta 'tests' e coloca resultados em 'results'
        run: |
          mkdir -p results
          # Se quiser falhar o job em caso de falha de teste, remova '|| true'
          robot --outputdir results tests || true

      - name: Upload test results artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results

  publish_pages:
    name: Publish logs to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (for context)
        uses: actions/checkout@v4

      - name: Prepare site folder
        run: |
          rm -rf site || true
          mkdir -p site
          # Copia todos os arquivos gerados para a pasta site
          if [ -d results ]; then
            cp -r results/* site/ || true
          fi
          # Caso existam arquivos gerados na raiz do repositório, copiar também
          cp -n log.html site/ || true
          cp -n report.html site/ || true
          cp -n output.xml site/ || true
          # Exemplo: incluir recursos estáticos, se existirem
          if [ -d Json ]; then
            mkdir -p site/Json
            cp -r Json/* site/Json/ || true
          fi

      - name: List site folder (for debug)
        run: |
          echo '--- site contents ---'
          ls -la site || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: site

  deploy_pages:
    name: Deploy to GitHub Pages
    needs: publish_pages
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v1
