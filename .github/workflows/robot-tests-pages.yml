name: Robot Framework tests and publish logs to GitHub Pages

on:
  push:
    # Ajuste de acordo com sua branch principal; 'main' é padrão.
    # Executa em main e em qualquer branch que comece com 'feature/'
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Robot Framework tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install robotframework robotframework-requests Faker

      - name: Run Robot Framework tests
        # Executa todos os testes da pasta 'tests' e coloca resultados em 'results'
        run: |
          mkdir -p results
          # Se quiser falhar o job em caso de falha de teste, remova '|| true'
          robot --outputdir results tests || true

      - name: Upload test results artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results
