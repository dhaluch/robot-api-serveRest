name: Robot Framework tests and publish logs to GitHub Pages

on:
  push:
    # Ajuste de acordo com sua branch principal; 'main' é padrão.
    branches: [ main, feature/allure-report ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Robot Framework tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Instala Robot Framework e adaptador Allure para Robot
          pip install robotframework robotframework-requests allure-robotframework allure-python-commons

      - name: Run Robot Framework tests (generate Allure results)
        # Executa os testes e gera resultados padrão e Allure results
        run: |
          mkdir -p results
          # usa o listener do allure-robotframework para gerar allure-results
          robot --outputdir results --listener allure_robotframework tests || true

      - name: Upload test results artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results


  publish_pages:
    name: Publish Allure report to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download test results artifact
        uses: actions/download-artifact@v4
        with:
          name: robot-results
          path: ./

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: '17'

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: results/allure-results

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          # Use a Personal Access Token secret to allow pushing to gh-pages
          # Create a PAT with 'repo' scope and add it as repository secret GH_PAGES_PAT
          personal_token: ${{ secrets.GH_PAGES_PAT }}
          publish_branch: gh-pages
          publish_dir: gh-pages
