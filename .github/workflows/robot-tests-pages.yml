name: Robot Framework tests and publish logs to GitHub Pages

on:
  push:
    # Ajuste de acordo com sua branch principal; 'main' é padrão.
    branches: [ main, feature/allure-report ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Robot Framework tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Instala Robot Framework e adaptador Allure para Robot
          pip install robotframework robotframework-requests allure-robotframework allure-python-commons

      - name: Run Robot Framework tests (generate Allure results)
        # Executa os testes e gera resultados padrão e Allure results
        run: |
          mkdir -p results
          # usa o listener do allure-robotframework para gerar allure-results
          robot --outputdir results --listener allure_robotframework tests || true

      - name: Upload test results artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results

  report:
    name: Generate and publish Robot report
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: robot-results
          path: ./

      - name: Send report to PR/commit and add to job summary
        uses: joonvena/robotframework-reporter-action@v2.5
        with:
          gh_access_token: ${{ secrets.GITHUB_TOKEN }}
          report_path: results
          summary: 'true'


  