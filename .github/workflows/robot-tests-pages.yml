name: Robot Framework tests and publish logs to GitHub Pages

on:
  push:
    # Ajuste de acordo com sua branch principal; 'main' é padrão.
    branches: [ main, feature/allure-report ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run Robot Framework tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Instala Robot Framework e adaptador Allure para Robot
          pip install robotframework robotframework-requests allure-robotframework allure-python-commons

      - name: Run Robot Framework tests (generate Allure results)
        # Executa os testes e gera resultados padrão e Allure results
        run: |
          mkdir -p results
          # usa o listener do allure-robotframework para gerar allure-results
          robot --outputdir results --listener allure_robotframework tests || true

      - name: Upload test results artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results


  publish_pages:
    name: Publish Allure report to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download test results artifact
        uses: actions/download-artifact@v4
        with:
          name: robot-results
          path: ./

      - name: Prepare gh-pages folder with Robot reports
        run: |
          rm -rf gh-pages || true
          mkdir -p gh-pages
          # Copy Robot Framework reports if present
          if [ -f results/report.html ]; then
            cp results/report.html gh-pages/index.html || true
          fi
          if [ -f results/log.html ]; then
            cp results/log.html gh-pages/log.html || true
          fi
          if [ -f results/output.xml ]; then
            cp results/output.xml gh-pages/output.xml || true
          fi

      - name: List gh-pages contents
        run: |
          echo 'gh-pages content:'
          ls -la gh-pages || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: gh-pages

      - name: Deploy Pages
        uses: actions/deploy-pages@v1
